databaseChangeLog:

  - changeSet:
      id: loadData-address
      author: omkars
      changes:
        - loadData:
            catalogName: address
            columns:
              - column:
                  header: id
                  name: id
                  type: NUMERIC
              - column:
                  header: city
                  name: city
                  type: NUMERIC
              - column:
                  header: country
                  name: country
                  type: NUMERIC
              - column:
                  header: gps_location
                  name: gps_location
                  type: STRING
              - column:
                  header: pincode
                  name: pincode
                  type: STRING
              - column:
                  header: state
                  name: state
                  type: NUMERIC
            commentLineStartsWith: //
            encoding: UTF-8
            file: addresses.csv
            quotchar: ''''
            relativeToChangelogFile: true
            schemaName: public
            separator: '\t'
            tableName: address
            usePreparedStatements: false


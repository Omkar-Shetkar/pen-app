apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: omkarshetkar/pen-backend:0.0.1
          ports:
            - containerPort: 8900
          imagePullPolicy: Always
          resources:
            requests:
              memory: "1Gi"
              cpu: "1"
            limits:
              memory: "1Gi"
              cpu: "1"
          env:
            - name: SPRING_APPLICATION_JSON
              valueFrom:
                configMapKeyRef:
                  name: spring-application-json
                  key: application-env
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: postgres-secret
          volumeMounts:
            - mountPath: "/etc/env/app"
              name: config
            - name: postgres-secret
              mountPath: "/etc/env/secret"
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: spring-application-json
        - name: postgres-secret
          secret:
            secretName: postgres-secret

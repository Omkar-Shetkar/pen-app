databaseChangeLog:
  - changeSet:
      id: loadData-language
      author: omkars
      changes:
        - loadData:
            catalogName: language
            columns:
              - column:
                  header: id
                  name: id
                  type: NUMERIC
              - column:
                  header: name
                  name: name
                  type: STRING
            commentLineStartsWith: //
            encoding: UTF-8
            file: languages.csv
            quotchar: ''''
            relativeToChangelogFile: true
            schemaName: public
            separator: '\t'
            tableName: language
            usePreparedStatements: false

  - changeSet:
        id: loadData-exam
        author: omkars
        changes:
            - loadData:
                  catalogName: exam
                  columns:
                      - column:
                            header: id
                            name: id
                            type: NUMERIC
                      - column:
                            header: name
                            name: name
                            type: STRING
                  commentLineStartsWith: //
                  encoding: UTF-8
                  file: exams.csv
                  quotchar: ''''
                  relativeToChangelogFile: true
                  schemaName: public
                  separator: '\t'
                  tableName: exam
                  usePreparedStatements: false

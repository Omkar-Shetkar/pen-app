logging.level:
  org:
    springframework:
#      security: DEBUG
#      jdbc.core.JdbcTemplate: DEBUG

spring:
  profiles:
    active: dev, prod
    banner:
      location: classpath:banner.txt
  info:
    app:
      name: "pen-backend"
      description: "Spring Boot Pen Backend Project"
      encoding: "@project.build.sourceEncoding@"
      version: "@version@"
      #reading these attributes from pom.xml file
      java:
        source: "@java.version@"
        target: "@java.version@"
---
server.port: 8900

spring:
  profiles: dev, prod
  liquibase:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak-service:8080/auth/realms/light/protocol/openid-connect/certs
  datasource:
    url: jdbc:postgresql://postgres-service:5432/light
    username: postgres
    password: password
    initialization-mode: always

pen.exam:
  schedule.delay-in-ms: 2700000 # 45 Mins - OTP is generated at the most given delay before start of the exam
  otp.expire-in-ms: 3600000 # 60 Mins - OTP Expires after 1 Hr of generation
  initial-delay-in-ms: 180000 # 3 Min

# Keycloak Configuration

keycloak:
  server: http://keycloak-service:8080/auth
  admin:
    realm: master
    client-id: admin-cli
    client-secret: 25458eac-37c7-4dd9-bb90-753db60c97a0

---
spring:
  profiles: test
  liquibase:
    enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_ON_EXIT=FALSE
  h2:
    console:
      enabled: true
  mail:
    host: smtp.gmail.com
    port: 587
    username:
    password:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

pen.exam:
  schedule.delay-in-ms: 5000 # 5 Secs - OTP is generated at the most given delay before start of the exam
  otp.expire-in-ms: 5000 # 5 Secs - OTP Expires after 1 Hr of generation
  initial-delay-in-ms: 5000 # 5 Secs

server.port: 8900

# HEALTH ENDPOINT
# to details across firewwalls
management:
  endpoints:
    web:
      exposure:
        include: "*"
  # to show details while localhost is accessed like - http://localhost:8080/actuator.
  endpoint:
    health:
      show-details: always
